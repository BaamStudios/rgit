# SPDX-License-Identifier: MIT
#
# cargo-deny configuration for rgit (issue #83).
# Run locally with: cargo deny check
#
# rgit is MIT-licensed and must stay free of copyleft code. The allowlist below
# may only be extended through a reviewed pull request. The ported git test suite
# (GPL-2.0) lives in the separate repository rgit-conformance and is not part of
# this dependency graph.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
# Path dependencies between workspace members carry no version; that is fine.
wildcards = "warn"
allow-wildcard-paths = true
# ADR 0002: rgit implements every subsystem itself. No libgit2, no gitoxide.
# cargo-deny has no name globs, so the gix-* crates are listed one by one;
# scripts/check-banned-deps.sh additionally rejects any `gix-*` name in Cargo.lock.
deny = [
    { crate = "git2", reason = "ADR 0002: no libgit2" },
    { crate = "libgit2-sys", reason = "ADR 0002: no libgit2" },
    { crate = "gix", reason = "ADR 0002: no gitoxide dependency" },
    { crate = "gix-actor", reason = "ADR 0002: no gitoxide dependency" },
    { crate = "gix-archive", reason = "ADR 0002: no gitoxide dependency" },
    { crate = "gix-attributes", reason = "ADR 0002: no gitoxide dependency" },
    { crate = "gix-bitmap", reason = "ADR 0002: no gitoxide dependency" },
    { crate = "gix-blame", reason = "ADR 0002: no gitoxide dependency" },
