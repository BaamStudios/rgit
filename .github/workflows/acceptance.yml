# M2 acceptance (issue #163): clone -> edit -> commit -> push with rgit alone.
#
# - gitea: a pinned Gitea container, the scenario over HTTPS (credential helper
#   and askpass) and SSH, verified on the server with the reference git.
#   Runs for every pull request and push to main.
# - gitea-server (M5, issue #71): the same Gitea image with rgit installed as
#   its only server-side git; scenarios with the reference git and rgit as
#   clients (HTTPS, OpenSSH, Gitea's built-in SSH, web views, PR merges,
#   hooks, wiki, mirrors, maintenance). Baseline run with the image's git
#   first. Known failures are listed in scripts/acceptance/m5-gitea-server.known.
# - github-public: anonymous HTTPS ls-remote and clone of public repositories
#   on github.com. Nightly and on demand, non-blocking.
#
# Both run the scripts in scripts/acceptance/, which also run locally.
name: Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      public:
        description: "Also run github-public (compat-table.yml passes false)"
        type: boolean
        default: true
  schedule:
    - cron: "41 2 * * *" # nightly, 02:41 UTC

permissions:
  contents: read

jobs:
  gitea:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITEA_IMAGE: gitea/gitea:1.24.6
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pull Gitea
        run: docker pull "$GITEA_IMAGE"
      - name: Build rgit
        run: cargo build --release -p rgit-cli
      - name: Scenario (HTTPS helper, HTTPS askpass, SSH)
        run: scripts/acceptance/m2-gitea.sh --rgit target/release/rgit

  gitea-server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITEA_IMAGE: gitea/gitea:1.24.6
      RGIT_MUSL: target/x86_64-unknown-linux-musl/release/rgit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl tools
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Pull Gitea
        run: docker pull "$GITEA_IMAGE"
      - name: Build rgit (static, runs inside the Alpine image)
        run: cargo build --release -p rgit-cli --target x86_64-unknown-linux-musl
      - name: Baseline (the image's git as server git)
        run: scripts/acceptance/m5-gitea-server.sh --server reference --rgit "$RGIT_MUSL"
      - name: rgit as server git
        if: ${{ !cancelled() }}
        run: scripts/acceptance/m5-gitea-server.sh --server rgit --rgit "$RGIT_MUSL"

  github-public:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.public)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Non-blocking: depends on github.com and on the size of git/git.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rgit
        run: cargo build --release -p rgit-cli
      - name: Small repository
        run: scripts/acceptance/github-public.sh --rgit target/release/rgit https://github.com/octocat/Hello-World.git
      - name: git/git
        if: ${{ !cancelled() }}
        run: scripts/acceptance/github-public.sh --rgit target/release/rgit https://github.com/git/git.git
