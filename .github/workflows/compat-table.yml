# Compatibility table (README.md, "Compatibility with git"): regenerated
# nightly from the newest successful Conformance run on main by
# scripts/compat-table.py. When the numbers changed, the job force-pushes the
# branch bot/compat-table, opens (or updates) the pull request "Update
# compatibility table" with auto-merge, and dispatches the required workflows
# on that branch: a pull request opened with GITHUB_TOKEN triggers no
# pull_request workflows, but workflow_dispatch runs do, and their check runs
# land on the branch's head commit. See CONTRIBUTING.md.
name: Compatibility table
on:
  schedule:
    - cron: "17 5 * * *" # nightly, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: compat-table
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/compat-table
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache upstream git checkout
        uses: actions/cache@v4
        with:
          path: upstream/git
          key: upstream-git-v2.56.1
      - name: Fetch upstream git (command-list.txt and t/ as data)
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rgit (its command dispatch decides the status column)
        run: cargo build --locked --bin rgit
      - name: Regenerate the table
        run: scripts/compat-table.py --update-readme
      - name: Open or update the pull request
        run: |
          if git diff --quiet -- README.md docs/compat/compat.json; then
            echo "Compatibility table unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898583+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add README.md docs/compat/compat.json
          summary=$(jq -r '.totals | "strict pass \(.strict)/\(.valid), \(.native)/\(.commands) commands native"' docs/compat/compat.json)
          git commit -q -s -m "docs: update the compatibility table" -m "Generated by scripts/compat-table.py ($summary)."
          git push --force origin "$BRANCH"
          if test -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')"; then
            gh pr create --base main --head "$BRANCH" --title "Update compatibility table" \
              --body "Nightly refresh of the table \"Compatibility with git\" in README.md and of docs/compat/compat.json ($summary), generated by scripts/compat-table.py from the newest successful Conformance run on main (workflow compat-table.yml)."
          fi
          gh pr merge "$BRANCH" --auto --squash
          # Required checks: run the PR workflows on the branch.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run conformance.yml --ref "$BRANCH"
          gh workflow run license-guard.yml --ref "$BRANCH"
          gh workflow run acceptance.yml --ref "$BRANCH" -f public=false
