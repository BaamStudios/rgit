name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # Other platforms (#183; owner decision 2026-11-26: Linux, Windows and
  # macOS). Build and clippy must be clean. The tests run completely; the
  # test targets that are known to fail on a platform are recorded with an
  # issue reference in ci/platform/<platform>.txt, any other failure fails
  # the job (scripts/platform-tests.sh, docs/platforms.md).
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, baseline: macos }
          - { name: Windows, os: windows-latest, baseline: windows }
    defaults:
      run:
        shell: bash
    steps:
      # Test data is compared byte for byte: no CRLF conversion on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: git --version
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test --all (failures compared with ci/platform/${{ matrix.baseline }}.txt)
        run: scripts/platform-tests.sh ${{ matrix.baseline }}

  # MSRV (#237): the workspace must build and pass its tests on the
  # `rust-version` declared in Cargo.toml, not only on stable.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo test --all --locked

  # License guards (#83, #84): SPDX headers and ADR 0002 dependency bans.
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: No gitoxide / libgit2 in Cargo.lock
        run: scripts/check-banned-deps.sh

  # cargo-deny (#83): license allowlist, bans and sources must pass.
  # Advisories may appear at any time for unchanged code, so they are reported
  # but do not block a pull request.
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - licenses bans sources
          - advisories
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # Developer Certificate of Origin (#86): every commit of a pull request
  # carries a Signed-off-by trailer matching its author.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Signed-off-by on every commit
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
