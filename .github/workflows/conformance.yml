# Conformance: run the ported git test suite (BaamStudios/rgit-conformance, the
# commit pinned in conformance.lock) against the reference git and against rgit.
# See docs/adr/0001-*.md. Issue #9.
name: Conformance
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference:
    name: Reference git
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pin.outputs.version }}
      repo: ${{ steps.pin.outputs.repo }}
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned versions
        id: pin
        run: |
          # The upstream version lives in exactly one place: scripts/fetch-upstream.sh
          version=$(sed -n 's/^GIT_REF="\${GIT_REF:-\(.*\)}"$/\1/p' scripts/fetch-upstream.sh)
          repo=$(sed -n 's/^repo = "https:\/\/github.com\/\(.*\)\.git"$/\1/p' conformance.lock)
          commit=$(sed -n 's/^commit = "\([0-9a-f]\{40\}\)"$/\1/p' conformance.lock)
          test -n "$version" && test -n "$repo" && test -n "$commit" || {
            echo "::error::cannot read the pinned versions"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          # cached per version and runner image (ImageOS/ImageVersion are runner env vars)
          echo "cache-key=reference-git-$version-norust-$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - name: Check out rgit-conformance
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: conformance
      - name: Suite and rgit agree on the reference version
        run: |
          suite=$(tr -d ' \n' <conformance/REFERENCE_VERSION)
          if test "$suite" != "${{ steps.pin.outputs.version }}"; then
            echo "::error::rgit-conformance is ported from $suite, scripts/fetch-upstream.sh pins ${{ steps.pin.outputs.version }}"
            exit 1
          fi
      - name: Restore reference build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgit-conformance/git-${{ steps.pin.outputs.version }}-norust
          key: ${{ steps.pin.outputs.cache-key }}
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext libcurl4-openssl-dev libexpat1-dev libpcre2-dev libssl-dev zlib1g-dev
      - name: Build reference git
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          GIT_REF=${{ steps.pin.outputs.version }} scripts/fetch-upstream.sh
          NO_RUST=YesPlease RGIT_REFERENCE_SOURCE="$PWD/upstream/git" conformance/run --build-only
      - name: Reference build is usable
        run: |
          ~/.cache/rgit-conformance/git-${{ steps.pin.outputs.version }}-norust/git version
          test -x ~/.cache/rgit-conformance/git-${{ steps.pin.outputs.version }}-norust/t/helper/test-tool

  conformance:
    name: Conformance (fallback + strict)
    needs: reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rgit-conformance
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.reference.outputs.repo }}
          ref: ${{ needs.reference.outputs.commit }}
          path: conformance
      - name: Cache key for this runner image
        id: key
        run: echo "cache-key=reference-git-${{ needs.reference.outputs.version }}-norust-$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - name: Restore reference build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgit-conformance/git-${{ needs.reference.outputs.version }}-norust
          key: ${{ steps.key.outputs.cache-key }}
      - name: Build reference git (only if this runner image missed the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext libcurl4-openssl-dev libexpat1-dev libpcre2-dev libssl-dev zlib1g-dev
          GIT_REF=${{ needs.reference.outputs.version }} scripts/fetch-upstream.sh
          NO_RUST=YesPlease RGIT_REFERENCE_SOURCE="$PWD/upstream/git" conformance/run --build-only
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rgit
        run: cargo build --locked --bin rgit --bin rgit-test-tool
      - name: Install Apache for lib-httpd.sh (#87)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apache2
          sudo systemctl stop apache2 || :
      - name: Run conformance suite and regression gate
        env:
          # A missing web server or git daemon fails the HTTP/daemon scripts
          # instead of skipping them (#87).
          GIT_TEST_HTTPD: "true"
          GIT_TEST_GIT_DAEMON: "true"
        run: |
          # Lead decision 2026-11-12: only regressions (pass -> fail) fail the build.
          # STATUS.md/baseline are refreshed in rgit-conformance, not per rgit PR.
          conformance/run --mode both --rgit target/debug/rgit --check
      - name: Self-test of the regression gate
        run: conformance/selftest/gate.sh
      - name: Summary
        if: always()
        run: |
          f=conformance/results/default/STATUS.generated.md
          test -f "$f" && sed -n '/^## Summary/,/^## Per-case/p' "$f" | sed '$d' >>"$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance/results/**/STATUS.generated.md
            conformance/results/**/*.tap
            conformance/results/**/*.tsv
            conformance/results/**/*.meta
            conformance/results/**/*.stderr
          if-no-files-found: warn

  # Differential tests (rgit-difftest, #7) against the pinned reference git
  # (#237). RGIT_REQUIRE_REFERENCE=1 turns a missing reference into a failure
  # instead of a silent skip or a fallback to the runner's git.
  difftest:
    name: Differential tests (pinned reference git)
    needs: reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out rgit-conformance
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.reference.outputs.repo }}
          ref: ${{ needs.reference.outputs.commit }}
          path: conformance
      - name: Cache key for this runner image
        id: key
        run: echo "cache-key=reference-git-${{ needs.reference.outputs.version }}-norust-$ImageOS-$ImageVersion" >>"$GITHUB_OUTPUT"
      - name: Restore reference build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rgit-conformance/git-${{ needs.reference.outputs.version }}-norust
          key: ${{ steps.key.outputs.cache-key }}
      - name: Build reference git (only if this runner image missed the cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext libcurl4-openssl-dev libexpat1-dev libpcre2-dev libssl-dev zlib1g-dev
          GIT_REF=${{ needs.reference.outputs.version }} scripts/fetch-upstream.sh
          NO_RUST=YesPlease RGIT_REFERENCE_SOURCE="$PWD/upstream/git" conformance/run --build-only
      - name: Install the reference exec path and templates
        run: |
          # The build tree's git looks for its programs and templates at its
          # compile-time prefix (<prefix>/libexec/git-core, <prefix>/share/
          # git-core/templates). Without them every init/clone warns, and a
          # reference receive-pack runs `git unpack-objects` through PATH,
          # where the tests put rgit. bin-wrappers/git is no substitute: it
          # forces GIT_TEMPLATE_DIR and GIT_EXEC_PATH, which tests set.
          ref=~/.cache/rgit-conformance/git-${{ needs.reference.outputs.version }}-norust
          exec_path=$("$ref/git" --exec-path)
          prefix=$(dirname "$(dirname "$exec_path")")
          mkdir -p "$exec_path" "$prefix/share/git-core/templates"
          find "$ref" -maxdepth 1 -type f -perm -u+x -name 'git*' \
            -exec ln -sf {} "$exec_path/" \;
          cp -R "$ref/templates/blt/." "$prefix/share/git-core/templates/"
          "$ref/git" init -q "$RUNNER_TEMP/probe" 2>"$RUNNER_TEMP/init.err"
          if test -s "$RUNNER_TEMP/init.err"; then cat "$RUNNER_TEMP/init.err"; exit 1; fi
          echo "RGIT_REFERENCE_GIT=$ref/git" >>"$GITHUB_ENV"
          echo "RGIT_REQUIRE_REFERENCE=1" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Differential tests
        run: |
          "$RGIT_REFERENCE_GIT" version
          echo "RGIT_REFERENCE_GIT=$RGIT_REFERENCE_GIT RGIT_REQUIRE_REFERENCE=$RGIT_REQUIRE_REFERENCE"
          cargo test --all --locked
