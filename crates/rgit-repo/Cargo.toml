[package]
name = "rgit-repo"
description = "rgit: repository discovery, layout, format version and extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bstr = { version = "1.13", default-features = false, features = ["std"] }
rgit-config = { path = "../rgit-config" }
rgit-hash = { path = "../rgit-hash" }
rgit-trace = { path = "../rgit-trace" }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
rgit-difftest = { path = "../rgit-difftest" }
