[package]
name = "rgit-cli"
description = "rgit: unofficial clean-room reimplementation of git in Rust (not affiliated with the Git project)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "rgit"
path = "src/main.rs"

[dependencies]
bstr = { version = "1.13", default-features = false, features = ["std"] }
rgit-config = { path = "../rgit-config" }
rgit-ident = { path = "../rgit-ident" }
rgit-date = { path = "../rgit-date" }
rgit-diff = { path = "../rgit-diff" }
rgit-fs = { path = "../rgit-fs" }
rgit-hash = { path = "../rgit-hash" }
rgit-index = { path = "../rgit-index" }
rgit-object = { path = "../rgit-object" }
rgit-odb = { path = "../rgit-odb" }
rgit-options = { path = "../rgit-options" }
rgit-pack = { path = "../rgit-pack" }
rgit-pathspec = { path = "../rgit-pathspec" }
rgit-protocol = { path = "../rgit-protocol" }
rgit-refs = { path = "../rgit-refs" }
rgit-remote = { path = "../rgit-remote" }
rgit-repo = { path = "../rgit-repo" }
rgit-revwalk = { path = "../rgit-revwalk" }
rgit-trace = { path = "../rgit-trace" }
rgit-transport = { path = "../rgit-transport" }
rgit-protocol = { path = "../rgit-protocol" }
rgit-http = { path = "../rgit-http" }
rgit-remote = { path = "../rgit-remote" }
rgit-version = { path = "../rgit-version" }
rgit-worktree = { path = "../rgit-worktree" }
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
rgit-difftest = { path = "../rgit-difftest" }
tempfile = "3"
