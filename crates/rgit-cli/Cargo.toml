[package]
name = "rgit-cli"
description = "rgit: unofficial clean-room reimplementation of git in Rust (not affiliated with the Git project)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "rgit"
path = "src/main.rs"

[dependencies]
rgit-options = { path = "../rgit-options" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"
