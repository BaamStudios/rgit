[package]
name = "rgit-reflog"
description = "rgit: reflog files (read, append, rename, delete) and @{n} / @{date} / @{-n} lookup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rgit-date = { path = "../rgit-date" }
rgit-fs = { path = "../rgit-fs" }
rgit-hash = { path = "../rgit-hash" }
thiserror = "2"

[dev-dependencies]
rgit-difftest = { path = "../rgit-difftest" }
tempfile = "3"
