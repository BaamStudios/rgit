[package]
name = "rgit-worktree"
description = "Work tree support for rgit: ignore rules and stat/racy-git comparison of index entries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rgit-hash = { path = "../rgit-hash" }
rgit-index = { path = "../rgit-index" }
rgit-pathspec = { path = "../rgit-pathspec" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
rgit-difftest = { path = "../rgit-difftest" }
