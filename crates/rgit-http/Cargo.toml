[package]
name = "rgit-http"
description = "Smart HTTP transport client (HTTP/1.1 and HTTP/2 over rustls) for rgit (clean-room, not affiliated with the Git project)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rgit-config = { path = "../rgit-config" }
rgit-protocol = { path = "../rgit-protocol" }
rgit-remote = { path = "../rgit-remote" }
rgit-trace = { path = "../rgit-trace" }
rgit-transport = { path = "../rgit-transport" }
thiserror = "2"
bstr = "1"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.12", features = ["std"] }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# HTTP/2 test server (tests/support/h2server.rs) only.
bytes = "1"
h2 = "0.4"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
