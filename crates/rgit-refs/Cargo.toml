[package]
name = "rgit-refs"
description = "rgit: references (loose refs, packed-refs, symbolic refs, transactions)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.0"
# zlib-rs: pure Rust zlib (Zlib license), as in rgit-odb and rgit-pack.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rgit-bstr = { path = "../rgit-bstr" }
rgit-date = { path = "../rgit-date" }
rgit-fs = { path = "../rgit-fs" }
rgit-hash = { path = "../rgit-hash" }
thiserror = "2"

[dev-dependencies]
rgit-bstr = { path = "../rgit-bstr" }
rgit-difftest = { path = "../rgit-difftest" }
tempfile = "3"
