[package]
name = "rgit-transport"
description = "Transports (file, SSH) and credentials for rgit, plus the transport trait smart HTTP builds on (clean-room, not affiliated with the Git project)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rgit-config = { path = "../rgit-config" }
rgit-protocol = { path = "../rgit-protocol" }
rgit-trace = { path = "../rgit-trace" }
bstr = { version = "1.13", default-features = false, features = ["std"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# Safe termios wrapper to read passwords from the terminal without echo.
rustix = { version = "1", default-features = false, features = ["std", "termios"] }

[dev-dependencies]
rgit-difftest = { path = "../rgit-difftest" }
tempfile = "3"
